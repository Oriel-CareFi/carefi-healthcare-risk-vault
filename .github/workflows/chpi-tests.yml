name: CHPI research tests
on:
  pull_request:
    paths:
      - 'healthcare_indices/**'
      - '.github/workflows/chpi-tests.yml'
  push:
    paths:
      - 'healthcare_indices/**'
      - '.github/workflows/chpi-tests.yml'
jobs:
  test-chpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify CHPI research engine
        run: python -m unittest discover -s healthcare_indices/chpi/tests -v
